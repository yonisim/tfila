<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <link href="./styles/main.css" rel="stylesheet">
    <link href="./styles/scroll.css" rel="stylesheet">
    <link href="./styles/tfilot.css" rel="stylesheet">
    <link href="./styles/tailwind-tfilot-single-page.css" rel="stylesheet">
    <link href="./styles/time-travel.css" rel="stylesheet">
    <title>משכן תחיה</title>
  </head>
  <body class="main-bg">
      
    <div id="main-div">
    </div>

    <!-- שעון + תאריך עברי — כרום קבוע מחוץ ל-main-div, כדי שלא ידהה עם המצגת.
         class="tz-page" הכרחי: tailwind.config.js מגדיר important: '.tz-page',
         כך שכל ה-utilities של לוח התאריכים פעילים רק בתוך אב כזה. -->
    <div id="hero-hud-host" class="tz-page" aria-hidden="true"></div>

    <!-- Ctrl+D — בחירת תאריך/שעה לבדיקה. חייב לרוץ לפני present-next-page.js
         (script רגיל רץ לפני module נדחה) כדי לעטוף את Date בזמן. -->
    <script src="./scripts/time-travel.js"></script>
    <script src="./scripts/present-next-page.js" type="module"></script>
  </body>
</html>
