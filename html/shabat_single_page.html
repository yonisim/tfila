<div
  id="shabat_single_page"
  class="tz-page shabat-tl-page tz-page-bg relative flex h-full min-h-0 w-full max-w-full min-w-0 flex-col overflow-hidden text-on-surface"
  dir="rtl"
>
  <main
    id="shabat_tl_main"
    class="tfilot-main-offset relative z-0 flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden"
  >
    <!-- Centered page title with parasha (clock + date HUD float over the ends) -->
    <div class="shabat-tl-title">
      <h1>
        <span>זמני תפילות שבת</span>
        <span class="shabat-tl-title-sep" aria-hidden="true">–</span>
        <span class="shabat-tl-title-parasha" id="prayer-times-title-parasha"></span>
      </h1>
    </div>

    <!-- Three empty timeline columns (RTL: right → middle → left rail).
         Bands, dividers and rows are all built in html-builders.js and injected
         by present_shabat_prayer_times(). -->
    <div class="shabat-tl-grid">
      <section class="shabat-tl-col" id="shabat_tl_col_eve"></section>
      <section class="shabat-tl-col" id="shabat_tl_col_afternoon"></section>
      <section class="shabat-tl-col shabat-tl-rail" id="shabat_tl_col_halacha"></section>
    </div>
  </main>
</div>
